# Robosense Airy (96ライン MEMS LiDAR) パラメータ          #
# - 96ライン構成により十分な点群密度を確保                 #
# - 標準パラメータで高品質なオドメトリを実現                #
#                                                         #
###########################################################

/**:
  ros__parameters:
    use_sim_time: false      # シミュレーション時刻を使用しない（実機用）

    # 座標フレーム名の定義
    frames/odom: odom           # オドメトリフレーム
    frames/baselink: base_link  # ロボットベースリンク
    frames/lidar: lidar         # LiDARフレーム
    frames/imu: imu             # IMUフレーム

    # マップ生成設定
    map/waitUntilMove: true        # ロボットが動くまで待機
    map/dense/filtered: false      # 密なマップをフィルタリングしない
    map/sparse/leafSize: 0.25      # スパースマップのリーフサイズ (m)

    # オドメトリ基本設定
    odom/gravity: 9.80665           # 重力加速度 (m/s^2)
    odom/computeTimeOffset: true    # LiDARとIMUの時刻オフセットを計算

    # IMU設定
    odom/imu/approximateGravity: false  # 重力を近似しない（正確な値を使用）
    odom/imu/calibration/gyro: true     # ジャイロのキャリブレーションを有効化
    odom/imu/calibration/accel: true    # 加速度計のキャリブレーションを有効化
    odom/imu/calibration/time: 3.0      # キャリブレーション時間 (秒)
    odom/imu/bufferSize: 5000           # IMUバッファサイズ

    # 点群前処理パラメータ（96ライン用の標準設定）
    odom/preprocessing/cropBoxFilter/size: 1.0  # クロップボックスのサイズ (m)
    # 96ライン構成では十分な点群密度があるため、標準的なボクセルサイズを使用
    odom/preprocessing/voxelFilter/res: 0.25    # ボクセルフィルタの解像度 (m)

    # キーフレーム生成の閾値（標準設定）
    # 96ライン構成では十分な特徴点が得られるため、標準的な閾値を使用
    odom/keyframe/threshD: 1.0   # キーフレーム生成の距離閾値 (m)
    odom/keyframe/threshR: 45.0  # キーフレーム生成の回転閾値 (度)

    # サブマップとGICPパラメータ（標準設定）
    odom/submap/keyframe/knn: 10  # 最近傍キーフレーム数
    odom/submap/keyframe/kcv: 10  # 凸包用キーフレーム数
    odom/submap/keyframe/kcc: 10  # 凹包用キーフレーム数

    # GICP（Generalized Iterative Closest Point）設定
    odom/gicp/minNumPoints: 64              # GICP実行に必要な最小点数
    odom/gicp/kCorrespondences: 16          # 対応点の数
    odom/gicp/maxCorrespondenceDistance: 0.5 # 対応点の最大距離 (m)
    odom/gicp/maxIterations: 32             # 最大反復回数
    odom/gicp/transformationEpsilon: 0.01   # 変換行列の収束判定閾値
    odom/gicp/rotationEpsilon: 0.01         # 回転の収束判定閾値
    odom/gicp/initLambdaFactor: 1e-9        # 初期λ係数（レーベンバーグ・マルカート法）

    # 幾何オブザーバーのゲイン設定
    odom/geo/Kp: 4.5          # 位置ゲイン
    odom/geo/Kv: 11.25        # 速度ゲイン
    odom/geo/Kq: 4.0          # 姿勢ゲイン
    odom/geo/Kab: 2.25        # 加速度バイアスゲイン
    odom/geo/Kgb: 1.0         # ジャイロバイアスゲイン
    odom/geo/abias_max: 5.0   # 加速度バイアスの最大値 (m/s^2)
    odom/geo/gbias_max: 0.5   # ジャイロバイアスの最大値 (rad/s)
